name: MAIN public daily production
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Retrieve market data and publish after offline acceptance'
        type: boolean
        default: false
# Activation diff, only after acceptance (UTC, after 20:00 Madrid in CET and CEST):
#  schedule:
#    - cron: '17 20 * * 1-5'
#    - cron: '17 22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: riskbex-protected-publication-v2
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'apalomo75/RiskBEX' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      RISKBEX_PUBLICATION_ENABLED: ${{ vars.RISKBEX_PUBLICATION_ENABLED }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bind reviewed controller
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CONTROLLER_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/streamlit-rc1
          path: publication-source
          persist-credentials: false
      - name: Resolve latest release and require clean checkout
        working-directory: publication-source
        run: |
          test "$(git branch --show-current)" = release/streamlit-rc1
          test -z "$(git status --porcelain)"
          echo "RELEASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Frozen runtime and complete controller offline regression
        run: |
          python -m pip install -r backend/requirements-docker.lock
          python -m pip check
          VALIDATION="$RUNNER_TEMP/controller-offline"
          git -C publication-source worktree add --detach "$VALIDATION" "$RELEASE"
          for directory in scripts src tests config; do
            cp -a "backend/$directory/." "$VALIDATION/backend/$directory/"
          done
          cp -a .github/. "$VALIDATION/.github/"
          (cd "$VALIDATION" && python backend/scripts/run_actions_offline.py --expected-release-sha "$RELEASE")
          rm -rf -- "$VALIDATION"
          git -C publication-source worktree prune
      - name: Retrieve, validate and publish atomically
        if: vars.RISKBEX_PUBLICATION_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          git -C publication-source config user.name riskbex-publication
          git -C publication-source config user.email riskbex-publication@users.noreply.github.com
          ASKPASS="$RUNNER_TEMP/git-askpass"
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$GH_TOKEN";; esac
          SH
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          python backend/scripts/run_public_daily.py --root publication-source --work "$RUNNER_TEMP/public-daily" --head "$RELEASE" | tee "$RUNNER_TEMP/daily-summary.json"
          cat "$RUNNER_TEMP/daily-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Report validation-only execution
        if: vars.RISKBEX_PUBLICATION_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        run: |
          echo 'Offline acceptance passed. Live retrieval and public publication are disabled for this run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/public-daily" "$RUNNER_TEMP/git-askpass"
          if test '${{ job.status }}' != success; then
            echo '::error::Daily publication failed. Inspect release approval and remote head before retry; never force push.'
          fi
