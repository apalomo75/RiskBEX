name: MAIN live-data dry run
on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: 'Reviewed main commit containing this workflow and dry-run code (full SHA)'
        type: string
        required: true
      authorize_live_download:
        description: 'Separately authorize one real Yahoo download, without publication'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
# New isolated group; never reuse the offline/diagnostic group.
concurrency:
  group: riskbex-live-dry-run-v1
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && inputs.authorize_live_download
    environment: live-data-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed controller
        env:
          REVIEWED_SHA: ${{ inputs.implementation_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/streamlit-rc1
          path: approved-source
          persist-credentials: false
      - name: Verify approved source before execution
        run: test "$(git -C approved-source rev-parse HEAD)" = 3cffc6b377a4010272788c9e434111c12258aeea
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install reviewed frozen runtime
        run: |
          python -m pip install -r approved-source/backend/requirements-docker.lock
          python -m pip check
      - name: Install reviewed dry-run adapter into disposable source checkout
        run: |
          cp backend/scripts/run_actions_live_dry_run.py approved-source/backend/scripts/
          cp backend/tests/test_live_dry_run.py approved-source/backend/tests/
          mkdir -p approved-source/backend/tests/fixtures/live-dry-run
          cp backend/tests/fixtures/live-dry-run/extension.csv approved-source/backend/tests/fixtures/live-dry-run/
          cp .github/workflows/live-data-dry-run.yml approved-source/.github/workflows/
      - name: Offline regression and safety gates before network
        working-directory: approved-source
        run: |
          python - <<'PYTEST'
          import unittest
          from scripts.run_actions_offline import offline_guards
          modules = ['tests.test_live_dry_run', 'tests.test_actions_update', 'tests.test_daily_pipeline', 'tests.test_actions_cloud']
          with offline_guards():
              suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
              result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('Offline gates failed or skipped.')
          PYTEST
      - name: Authorized private live candidate
        working-directory: approved-source
        env:
          RISKBEX_LIVE_DRY_RUN_AUTHORIZED: 'true'
        run: |
          umask 077
          python backend/scripts/run_actions_live_dry_run.py --source-root . --work "$RUNNER_TEMP/riskbex-live-candidate" --authorize-live-download
      # Deliberately no upload-artifact, cache, summary payload, commit or push.
      - name: Remove private candidate and report
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/riskbex-live-candidate"
